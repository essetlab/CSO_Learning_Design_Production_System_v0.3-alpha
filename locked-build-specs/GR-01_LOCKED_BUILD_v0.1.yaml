content:
  document_title: GR-01 · Magnetic Course Entry
  vertical_marker: HUMAN RIGHTS-BASED APPROACH
  eyebrow: CSO LEARNING HUB · HUMAN RIGHTS-BASED APPROACH
  course_name: Human Rights-Based Approach in CSO Practice
  headline:
    first_line: Ask better questions.
    emphasis_line: Make stronger decisions.
  proposition: >-
    Use a practical rights lens to notice who is affected, who may be left out,
    who should be heard, who has responsibility, and what should change after people participate.
  context_line: >-
    Built for local and grassroots CSO practitioners working with real project constraints,
    communities, partners and public actors.
  primary_cta: Start the course
  primary_href: '#journey'
  secondary_action: See how the learning journey works
  secondary_href: '#journey'
  question_thread:
    aria_label: Five practical questions the course will help you use
    intro: A practical rights lens
    items:
      - Who is affected?
      - Who may be left out?
      - Who should be heard?
      - Who has responsibility?
      - What should change?
  chapter:
    number: '01'
    label: BEGIN WITH PRACTICE
  journey:
    kicker: THE LEARNING JOURNEY
    heading: Start from real work. Build the judgement to act differently.
    intro: >-
      The course moves from recognising rights issues in everyday CSO work to making stronger
      design, implementation and evidence decisions.
    items:
      - number: '01'
        title: Notice
        body: See who is affected, excluded or unheard.
      - number: '02'
        title: Interpret
        body: Examine responsibility, participation and power.
      - number: '03'
        title: Decide
        body: Make safer, more accountable project choices.
      - number: '04'
        title: Apply
        body: Carry useful decisions and tools back into practice.
  practice_focus:
    kicker: MY PRACTICE · OPTIONAL
    heading: What would be most useful to strengthen in your work?
    support: Choose one if it helps you focus your learning, or start without selecting. You can change this later.
    legend: Choose an optional practice focus
    storage_key: gr01-practice-focus
    empty_status: No practice focus selected — that is completely fine.
    clear_label: Clear my focus
    completion_dependency: false
    assessment_dependency: false
    options:
      - number: '01'
        value: Improve participation and inclusion
        label: Improve participation and inclusion
      - number: '02'
        value: Strengthen advocacy and accountability
        label: Strengthen advocacy and accountability
      - number: '03'
        value: Design stronger projects
        label: Design stronger projects
      - number: '04'
        value: Use evidence and feedback better
        label: Use evidence and feedback better
      - number: '05'
        value: Connect HRBA more clearly to daily work
        label: Connect HRBA more clearly to daily work
  close:
    aria_label: Start course
    kicker: READY WHEN YOU ARE
    heading: You do not need legal expertise to begin.
    body: Start with the questions. The course will help you use them in realistic CSO decisions.
